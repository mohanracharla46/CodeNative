<meta name="google-adsense-account" content="ca-pub-1268674050644687">
<script>
  (function() {
    function loadAdSense() {
      var script = document.createElement('script');
      script.async = true;
      script.src = "https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1268674050644687";
      script.crossOrigin = "anonymous";
      document.head.appendChild(script);

      window.requestIdleCallback(loadAdSense, { timeout: 3000 });

      loadAdSense();
    } else {
      window.addEventListener('load', loadAdSense, { passive: true });
    }
  })();
</script>
